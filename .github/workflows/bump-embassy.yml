# PROVEN LOCALLY, NOT YET RUN ON GITHUB. `nix run .#embassy-bump` -- the whole
# routine below -- has run on a workstation against current embassy main, and
# the tree it produced passes `nix flake check` and builds `.#embassy`. (The
# bump's own verification step was cut short by the machine running out of
# memory; the same builds were then run separately.) This workflow has never
# been dispatched, so runner disk space and run time are unmeasured. Opening
# the PR needs the repository setting "Allow GitHub Actions to create and
# approve pull requests", and a PR opened with GITHUB_TOKEN does not trigger
# ci.yml (close and reopen it, or give create-pull-request a PAT).
#
# Moves the `embassy` input to current main and opens a PR with the result. All
# of the work is `embassy-bump` -- the same command a human runs -- so a bump
# that works locally works here: it re-derives the embassy crate versions,
# re-resolves both crate sets, moves Rust if embassy's toolchain moved, and
# proves both firmwares and the bundle still build. If anything needs a human
# (an upstream API change in the example firmware, a crate removed upstream),
# it puts every file back, fails, and says what broke in the job summary.
name: Bump embassy

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# One bump at a time: a manual run and the weekly one must not race on the
# bump/embassy branch.
concurrency:
  group: bump-embassy
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    # Locally, everything up to the build took ~12 minutes (mostly resolving git
    # mode); the builds come on top. Not yet measured on a runner.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Bump
        run: nix run .#embassy-bump -- --summary "$RUNNER_TEMP/bump-summary.md"

      # Does nothing when the bump changed nothing.
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: bump/embassy
          title: Bump embassy, re-resolve both crate sets
          commit-message: Bump embassy, re-resolve both crate sets
          body-path: ${{ runner.temp }}/bump-summary.md
